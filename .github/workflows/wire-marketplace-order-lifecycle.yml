name: Wire marketplace buyer order lifecycle

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt'
      - 'app/src/main/java/com/fynx/app/ui/FynxRemoteSocialClient.kt'
      - 'app/src/main/java/com/fynx/app/ui/FynxMarketplaceOrderLifecycle.kt'
      - '.github/workflows/wire-marketplace-order-lifecycle.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire lifecycle dialog into order actions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt')
          s = p.read_text()
          state = '    var showLifecycle by remember { mutableStateOf(false) }\n'
          marker = '    var comment by remember { mutableStateOf("") }\n'
          if 'var showLifecycle by remember' not in s:
              if marker not in s: raise SystemExit('OrderActions state marker not found')
              s = s.replace(marker, marker + state, 1)
          old = '            Text("Protected order. Complete payment through an approved payment provider before shipment.", style = MaterialTheme.typography.bodySmall)\n'
          new = old + '''            if (order.status == "PAID" || order.status == "SHIPPED" || order.status == "INSPECTION") {\n                Text("Next step", style = MaterialTheme.typography.labelLarge)\n                Text(when (order.status) {\n                    "PAID" -> "Choose delivery or pickup so the seller can fulfill the order."\n                    "SHIPPED" -> "Confirm the order when you receive it."\n                    else -> "Inspect the order and complete it when everything is correct."\n                }, style = MaterialTheme.typography.bodySmall)\n            }\n'''
          if 'Choose delivery or pickup so the seller can fulfill the order.' not in s:
              if old not in s: raise SystemExit('protected order marker not found')
              s = s.replace(old, new, 1)
          old_confirm = '''            dispute -> Button(onClick = { scope.launch { FynxRemoteSocialClient.disputeMarketplaceOrder(context, order.id, "OTHER", details).onSuccess { onChanged() } } }) { Text("Open dispute") }\n            order.status == "PAYMENT_PENDING" -> Button(onClick = { scope.launch { FynxRemoteSocialClient.cancelMarketplaceOrder(context, order.id).onSuccess { onChanged() } } }) { Text("Cancel order") }\n            order.status == "COMPLETED" -> Button(onClick = { scope.launch { FynxRemoteSocialClient.reviewMarketplaceOrder(context, order.id, rating, comment).onSuccess { onChanged() } } }) { Text("Submit review") }\n            else -> Spacer(Modifier.size(1.dp))\n'''
          new_confirm = '''            dispute -> Button(onClick = { scope.launch { FynxRemoteSocialClient.disputeMarketplaceOrder(context, order.id, "OTHER", details).onSuccess { onChanged() } } }) { Text("Open dispute") }\n            order.status == "PAYMENT_PENDING" -> Button(onClick = { scope.launch { FynxRemoteSocialClient.cancelMarketplaceOrder(context, order.id).onSuccess { onChanged() } } }) { Text("Cancel order") }\n            order.status == "PAID" || order.status == "SHIPPED" || order.status == "INSPECTION" -> Button(onClick = { showLifecycle = true }) { Text(when (order.status) { "PAID" -> "Choose fulfillment"; "SHIPPED" -> "Confirm received"; else -> "Complete order" }) }\n            order.status == "COMPLETED" -> Button(onClick = { scope.launch { FynxRemoteSocialClient.reviewMarketplaceOrder(context, order.id, rating, comment).onSuccess { onChanged() } } }) { Text("Submit review") }\n            else -> Spacer(Modifier.size(1.dp))\n'''
          if 'Choose fulfillment"; "SHIPPED" -> "Confirm received"' not in s:
              if old_confirm not in s: raise SystemExit('confirm button marker not found')
              s = s.replace(old_confirm, new_confirm, 1)
          end_marker = '''    }, dismissButton = { TextButton(onClick = { if (!dispute && order.status != "COMPLETED") dispute = true else onClose() }) { Text(if (!dispute && order.status != "COMPLETED") "Report problem" else "Close") } })\n}\n'''
          replacement = '''    }, dismissButton = { TextButton(onClick = { if (!dispute && order.status != "COMPLETED") dispute = true else onClose() }) { Text(if (!dispute && order.status != "COMPLETED") "Report problem" else "Close") } })\n    if (showLifecycle) {\n        FynxMarketplaceOrderLifecycle(context, order, onChanged = { showLifecycle = false; onChanged() }, onClose = { showLifecycle = false })\n    }\n}\n'''
          if 'if (showLifecycle) {' not in s:
              if end_marker not in s: raise SystemExit('OrderActions end marker not found')
              s = s.replace(end_marker, replacement, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit wiring and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt
          git commit -m 'Connect buyer order lifecycle controls' || true
          git push
          git rm .github/workflows/wire-marketplace-order-lifecycle.yml
          git commit -m 'Remove one-time marketplace lifecycle wiring workflow'
          git push

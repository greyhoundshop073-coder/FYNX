name: FYNX Real App Walkthrough Video # current short-form highlight editor

on:
  push:
    branches:
      - tools/fynx-real-app-walkthrough-video-20261109
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  record:
    name: Build, launch and record the real FYNX Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the canonical FYNX source
        uses: actions/checkout@v4
        with:
          ref: tools/fynx-real-app-walkthrough-video-20261109
          fetch-depth: 1

      - name: Retrieve the latest successful canonical FYNX APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42579711634 --repo greyhoundshop073-coder/FYNX --name FYNX-Android-Official.apk --dir canonical-apk
          APK="canonical-apk/FYNX-Android-Official.apk"
          META="canonical-apk/FYNX-Android-Official-build.txt"
          test -s "$APK"
          test -s "$META"
          grep -Fx "commit=137688339cdfe72ff3d54d51974f6a3fd6185d8a" "$META"
          expected="$(sed -n 's/^apk_sha256=//p' "$META")"
          actual="$(sha256sum "$APK" | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
          mkdir -p app/build/outputs/apk/debug
          cp "$APK" app/build/outputs/apk/debug/app-debug.apk
          echo "Using canonical APK from integration commit 137688339cdfe72ff3d54d51974f6a3fd6185d8a"
          echo "Verified APK SHA-256: $actual"

      - name: Install video narration and editing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core python3-pip
          python3 -m pip install --user --break-system-packages edge-tts || echo "Neural voice install unavailable; the local eSpeak fallback will be used."
          command -v edge-tts || true
          ffmpeg -version | head -n 1
          espeak-ng --version | head -n 1

      - name: Enable KVM acceleration for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "KVM device is unavailable on this runner; continuing with the configured emulator graphics fallback."
          fi

      - name: Run FYNX in an Android emulator and record the user journey
        uses: reactivecircus/android-emulator-runner@v2.38.0
        timeout-minutes: 25
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            mkdir -p fynx-walkthrough
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.fynx.app android.permission.POST_NOTIFICATIONS || true
            python3 scripts/record_fynx_walkthrough.py
            adb logcat -d -v threadtime > fynx-walkthrough/device-logcat.txt

      - name: Create narrated and captioned advertising-ready version
        if: always()
        run: |
          if [ -s fynx-walkthrough/FYNX-Real-App-Walkthrough.mp4 ]; then
            python3 scripts/finish_fynx_walkthrough_video.py
          else
            echo "No raw app recording was produced; refusing to fabricate a video."
            exit 1
          fi

      - name: Upload actual FYNX walkthrough videos and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-Real-App-Walkthrough
          path: |
            fynx-walkthrough/*.mp4
            fynx-walkthrough/*.wav
            fynx-walkthrough/*.srt
            fynx-walkthrough/*.md
            fynx-walkthrough/*.txt
            fynx-walkthrough/device-logcat.txt
          if-no-files-found: warn
          retention-days: 30

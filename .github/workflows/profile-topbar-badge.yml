name: FYNX Profile Topbar Badge

on:
  push:
    branches:
      - profile-topbar-badge

permissions:
  contents: write

jobs:
  apply-profile-topbar-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated profile-badge branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply isolated topbar badge change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/fynx/app/ui/FynxApp.kt')
          text = path.read_text()
          old = '''                        IconButton(onClick = { selected = "Profile"; openProfileSettings = false }, modifier = Modifier.semantics(mergeDescendants = true) { contentDescription = "Open FYNX profile" }) {
                            if (remoteMyPhotoId != null) FynxRemoteProfileAvatar(remoteMyPhotoId, myProfile.displayName, Modifier.size(40.dp))
                            else FynxProfileImage(myProfile.displayName, myPhoto, Modifier.size(40.dp))
                        }'''
          new = '''                        FynxProfileButton(
                            onClick = { selected = "Profile"; openProfileSettings = false },
                            avatar = {
                                if (remoteMyPhotoId != null) FynxRemoteProfileAvatar(remoteMyPhotoId, myProfile.displayName, Modifier.size(40.dp))
                                else FynxProfileImage(myProfile.displayName, myPhoto, Modifier.size(40.dp))
                            }
                        )'''
          if old not in text:
              raise SystemExit('PROFILE BADGE RED: expected Home topbar profile button block was not found; no change made')
          if text.count(old) != 1:
              raise SystemExit('PROFILE BADGE RED: expected exactly one Home topbar profile button block')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify only the intended Home topbar call changed
        run: |
          grep -n -A8 -B2 'FynxProfileButton(' app/src/main/java/com/fynx/app/ui/FynxApp.kt
          test "$(grep -c 'FynxProfileButton(' app/src/main/java/com/fynx/app/ui/FynxApp.kt)" -eq 1

      - name: Commit isolated profile badge change and remove one-time workflow
        run: |
          git config user.name 'FYNX Profile Badge Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/fynx/app/ui/FynxApp.kt .github/workflows/profile-topbar-badge.yml
          git commit -m 'Add small profile topbar button badge'
          git push origin HEAD:profile-topbar-badge

name: FYNX Backend Lockfile Bootstrap

on:
  pull_request:
    branches: ["integration/fynx-single-apk-20261013"]
    paths:
      - ".github/workflows/fynx-backend-lockfile-bootstrap.yml"
      - "backend/package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout FYNX
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate npm lockfile from the canonical package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile with a clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit the verified lockfile and remove this temporary workflow
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git -C .. rm .github/workflows/fynx-backend-lockfile-bootstrap.yml
          git commit -m "FYNX-THIS-CHAT — Add reproducible backend npm lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

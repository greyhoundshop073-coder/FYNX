name: Repair Remote Social Client Syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair malformed Kotlin generic expressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/fynx/app/ui/FynxRemoteSocialClient.kt")
          s = p.read_text()
          old = s
          # Kotlin tokenizes `>=` as a comparison operator. These declarations
          # need the generic close and assignment separated: `> =`.
          s = s.replace(">=FynxBackendClient", "> = FynxBackendClient")
          s = s.replace(">=runCatching", "> = runCatching")
          s = s.replace(">=", "> =")
          if s == old:
              print("No syntax replacement needed")
          else:
              p.write_text(s)
              print("Repaired malformed generic return expressions")
          PY
          git diff --check

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fynx/app/ui/FynxRemoteSocialClient.kt
          git commit -m "Fix marketplace client Kotlin syntax" || true
          git push
          rm -f .github/workflows/repair-remote-social-client-syntax.yml
          git add .github/workflows/repair-remote-social-client-syntax.yml
          git commit -m "Remove one-time syntax repair workflow" || true
          git push || true

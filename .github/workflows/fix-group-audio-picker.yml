name: One-time Group Audio Picker Patch

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'FYNX Group Chat: patch audio picker implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Group Chat audio picker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/fynx/app/ui/GroupChatPanel.kt')
          s = p.read_text()

          old = '''    val documentPicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
          if (uri != null) {
              attachment = uri
              attachmentType = "document"
              attachmentName = uri.lastPathSegment?.substringAfterLast("/")?.takeIf { it.isNotBlank() } ?: "Document"
          }
      }
'''
          new = '''    val documentPicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
          if (uri != null) {
              attachment = uri
              attachmentType = "document"
              attachmentName = uri.lastPathSegment?.substringAfterLast("/")?.takeIf { it.isNotBlank() } ?: "Document"
          }
      }

      val audioPicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
          if (uri != null) {
              attachment = uri
              attachmentType = "audio"
              attachmentName = uri.lastPathSegment?.substringAfterLast("/")?.takeIf { it.isNotBlank() } ?: "Audio"
          }
      }
'''
          if old not in s:
              raise SystemExit('audio picker insertion point not found')
          s = s.replace(old, new, 1)

          old = '''                            IconButton(onClick = { documentPicker.launch(arrayOf("application/pdf", "text/plain", "application/zip", "application/msword", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/vnd.ms-excel", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "application/vnd.ms-powerpoint", "application/vnd.openxmlformats-officedocument.presentationml.presentation")) }, modifier = Modifier.size(48.dp)) {
                                Icon(Icons.Default.Description, "Document", tint = glassPalette.messageText)
                            }
'''
          new = '''                            IconButton(onClick = { documentPicker.launch(arrayOf("application/pdf", "text/plain", "application/zip", "application/msword", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/vnd.ms-excel", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "application/vnd.ms-powerpoint", "application/vnd.openxmlformats-officedocument.presentationml.presentation")) }, modifier = Modifier.size(48.dp)) {
                                Icon(Icons.Default.Description, "Document", tint = glassPalette.messageText)
                            }
                            IconButton(onClick = { audioPicker.launch(arrayOf("audio/*")) }, modifier = Modifier.size(48.dp)) {
                                Icon(Icons.Default.MusicNote, "Audio or music", tint = glassPalette.messageText)
                            }
'''
          if old not in s:
              raise SystemExit('composer document button insertion point not found')
          s = s.replace(old, new, 1)

          old = '''            text.trim().ifBlank { when (attachmentType) { "video_note" -> "Video note"; "video" -> "Video"; "document" -> "Document"; else -> "Photo" } },'''
          new = '''            text.trim().ifBlank { when (attachmentType) { "video_note" -> "Video note"; "video" -> "Video"; "audio" -> (attachmentName ?: "Audio"); "document" -> (attachmentName ?: "Document"); else -> "Photo" } },'''
          if old not in s:
              raise SystemExit('message label insertion point not found')
          s = s.replace(old, new, 1)

          old = '''                                    "video_note", "video" -> Icons.Default.Videocam
                                    "document" -> Icons.Default.Description
                                    else -> Icons.Default.Image
'''
          new = '''                                    "video_note", "video" -> Icons.Default.Videocam
                                    "audio" -> Icons.Default.MusicNote
                                    "document" -> Icons.Default.Description
                                    else -> Icons.Default.Image
'''
          if old not in s:
              raise SystemExit('attachment preview icon insertion point not found')
          s = s.replace(old, new, 1)

          old = '''                                    "video_note" -> "Video note ready"
                                    "video" -> "Video ready"
                                    "document" -> (attachmentName ?: "Document ready")
                                    else -> "Photo ready"
'''
          new = '''                                    "video_note" -> "Video note ready"
                                    "video" -> "Video ready"
                                    "audio" -> (attachmentName ?: "Audio ready")
                                    "document" -> (attachmentName ?: "Document ready")
                                    else -> "Photo ready"
'''
          if old not in s:
              raise SystemExit('attachment preview label insertion point not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff --check
          git diff -- app/src/main/java/com/fynx/app/ui/GroupChatPanel.kt
          test -n "$(git diff -- app/src/main/java/com/fynx/app/ui/GroupChatPanel.kt)"

      - name: Commit implementation and remove one-time patch workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-group-audio-picker.yml
          git config user.name 'FYNX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/fynx/app/ui/GroupChatPanel.kt .github/workflows/fix-group-audio-picker.yml
          git commit -m 'FYNX Group Chat: patch audio picker implementation'
          git push origin main

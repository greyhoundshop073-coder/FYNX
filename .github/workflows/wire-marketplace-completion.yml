name: Wire marketplace completion routes

on:
  push:
    branches: [main]
    paths:
      - 'backend/marketplaceCompletion.js'
      - 'backend/server.js'
      - '.github/workflows/wire-marketplace-completion.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register completion routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/server.js')
          s = p.read_text()
          imp = 'import { registerMarketplaceCompletionRoutes } from "./marketplaceCompletion.js";'
          if imp not in s:
              marker = 'import { registerMarketplaceReputationRoutes } from "./marketplaceReputation.js";'
              if marker not in s:
                  raise SystemExit('marketplace reputation import marker not found')
              s = s.replace(marker, marker + '\n' + imp, 1)
          call = 'registerMarketplaceCompletionRoutes({ app, pool, auth });'
          if call not in s:
              marker = 'registerMarketplaceReputationRoutes({ app, pool, auth });'
              if marker not in s:
                  raise SystemExit('marketplace reputation registration marker not found')
              s = s.replace(marker, marker + '\n' + call, 1)
          p.write_text(s)
          PY
          node --check backend/server.js

      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js
          if git diff --cached --quiet; then
            echo 'No wiring changes needed.'
            exit 0
          fi
          git commit -m 'Wire marketplace completion routes'
          git push

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .github/workflows/wire-marketplace-completion.yml >/dev/null 2>&1; then
            git rm .github/workflows/wire-marketplace-completion.yml
            git commit -m 'Remove one-time marketplace wiring workflow'
            git push
          fi

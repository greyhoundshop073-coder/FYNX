name: Wire FYNX Money Planner Backend

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[money-planner-wired]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire Money Planner route module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/server.js')
          s = p.read_text()
          imp = 'import { registerMoneyPlannerRoutes } from "./moneyPlanner.js";'
          if imp not in s:
              anchor = 'import { registerMarketplaceCompletionRoutes } from "./marketplaceCompletion.js";'
              if anchor not in s:
                  raise SystemExit('server import anchor not found')
              s = s.replace(anchor, anchor + '\n' + imp, 1)
          route = 'if (pool) registerMoneyPlannerRoutes({ app, pool, auth });'
          if route not in s:
              anchor = 'registerMarketplaceCompletionRoutes({ app, pool, auth });'
              if anchor not in s:
                  raise SystemExit('server route anchor not found')
              s = s.replace(anchor, anchor + '\n' + route, 1)
          p.write_text(s)
          PY

      - name: Validate backend JavaScript
        run: |
          node --check backend/moneyPlanner.js
          node --check backend/server.js

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js
          git diff --cached --quiet && exit 0
          git commit -m "Wire Money Planner backend [money-planner-wired]"
          git push

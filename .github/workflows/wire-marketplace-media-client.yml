name: Wire marketplace media client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point marketplace media at protected endpoint
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt')
          text = path.read_text()
          old = 'FynxProductionMessaging.cacheRemoteMedia(context, mediaId, "/api/media/$mediaId")'
          new = 'FynxProductionMessaging.cacheRemoteMedia(context, mediaId, "/api/marketplace/media/$mediaId")'
          if old not in text:
              raise SystemExit('expected marketplace media call not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt
          git commit -m 'Use protected marketplace media endpoint'
          git rm .github/workflows/wire-marketplace-media-client.yml
          git commit -m 'Remove one-time marketplace media workflow'
          git push

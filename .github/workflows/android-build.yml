name: FYNX Android Build # APK-only artifact fix
# Large Badge 14 certification fixes use full-runtime verification.

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "backend/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/android-build.yml"
      - ".maestro/**"
      - "visual-baselines/**"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "backend/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/android-build.yml"
      - ".maestro/**"
      - "visual-baselines/**"
  workflow_dispatch:
    inputs:
      full_runtime:
        description: "Run emulator/UI certification and produce an APK"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: fynx-android-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GOOGLE_CLOUD_PROJECT: fynx-f0868
  FYNX_WIF_PROVIDER: projects/742276831502/locations/global/workloadIdentityPools/fynx-github-actions/providers/fynx-github
  FYNX_GCP_SERVICE_ACCOUNT: fynx-github-actions@fynx-f0868.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle with CI caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: fynx-f0868
          workload_identity_provider: ${{ env.FYNX_WIF_PROVIDER }}
          service_account: ${{ env.FYNX_GCP_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Verify Google Cloud authentication
        run: |
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          gcloud config get-value project
      - name: Verify FYNX network transport architecture
        run: |
          echo "Running FYNX network certification on ${GITHUB_SHA}"
          python3 scripts/verify_network_transport_architecture.py
      - name: Verify live production backend reachability
        run: node scripts/verify_production_backend_reachability.mjs
      - name: Verify consolidated FCM notification phase
        run: python3 scripts/verify_fcm_notifications.py
      - name: Verify notifications and settings integration
        run: python3 scripts/verify_notifications_settings_integration.py
      - name: Verify consolidated Phase B real-user audit
        run: python3 scripts/verify_phase_b_real_user_audit.py
      - name: Verify Push 5-10 integration continuity
        run: python3 scripts/verify_push5_to_push10_integration.py
      - name: Verify consolidated Phase C security and production readiness
        run: python3 scripts/verify_phase_c_security_production.py
      - name: Verify Phase D integration continuity
        run: python3 scripts/verify_phase_d_integration_continuity.py
      - name: Verify R1 account isolation
        run: python3 scripts/verify_r1_account_isolation.py
      - name: Verify Stage 15D reliability foundations
        run: |
          node backend/verify-stage15d-reliability.mjs
          node backend/verify-stage15d-advanced.mjs
      - name: Verify Stage 16 camera and media integration
        run: python3 scripts/verify_stage16_camera.py
      - name: Verify Batch 5 location integration
        run: python3 scripts/verify_batch5_location.py
      - name: Verify Batch 6 Marketplace location intelligence
        run: python3 scripts/verify_batch6_marketplace_location.py
      - name: Verify Batch 7 Music library integration
        run: python3 scripts/verify_batch7_music.py
      - name: Verify Batch 8 Feeling and Activity integration
        run: python3 scripts/verify_batch8_feeling_activity.py
      - name: Verify Batch 9 Create Post integration
        run: python3 scripts/verify_batch9_create_post_integration.py
      - name: Verify Batch 10 Create Post hardening
        run: python3 scripts/verify_batch10_create_post_hardening.py
      - name: Verify Camera to Post journey
        run: python3 scripts/verify_camera_post_journey.py
      - name: Verify Batch 11 chat expressions and reactions
        run: python3 scripts/verify_batch11_chat_expressions.py
      - name: Verify FYNX AI extension contract
        run: python3 scripts/verify_ai_extension_contract.py
      - name: Verify FYNX AI security and tool integrity
        run: python3 scripts/verify_ai_security.py
      - name: Verify consolidated FYNX user journey integration
        run: python3 scripts/verify_fynx_journey.py
      - name: Verify this-chat Marketplace, Groups, Calls, Trust & Admin ownership integrity
        run: python3 scripts/verify_this_chat_workstream.py
      - name: Verify R2-C realtime recovery invariants
        run: python3 scripts/verify_r2c_realtime.py
      - name: Verify R2-D failure and recovery audit
        run: python3 scripts/verify_r2d_recovery.py
      - name: Verify R2-E final network reliability gate
        run: python3 scripts/verify_r2e_final.py
      - name: Verify R3 HTTP and realtime messaging consistency
        run: python3 scripts/verify_r3_messaging_consistency.py
      - name: Verify R3 final integration and security gate
        run: python3 scripts/verify_r3_final_integration.py
      - name: Verify R4 people, profiles and privacy security gate
        run: python3 scripts/verify_r4_people_privacy.py
      - name: Verify Batch 4 Text background integrity
        run: python3 scripts/verify_batch4_text_backgrounds.py
      - name: Verify Batch 3 People audience integrity
        run: python3 scripts/verify_batch3_people_audience.py
      - name: Verify R5A groups security gate
        run: python3 scripts/verify_r5a_groups.py
      - name: Verify R5B Status and Stories security + presentation gate
        run: python3 scripts/verify_r5b_status.py
      - name: Verify R6-A marketplace protection state
        run: python3 scripts/verify_r6a_marketplace_protection.py
      - name: Verify Marketplace seller flow integrity
        run: python3 scripts/verify_marketplace_seller_flow.py
      - name: Verify Marketplace integration and security audit
        run: python3 scripts/verify_marketplace_integration_security.py
      - name: Verify FYNX revenue infrastructure
        run: node scripts/verify_revenue_infrastructure.mjs
      - name: Verify FYNX monetization production
        run: node scripts/verify_monetization_production.mjs
      - name: Verify Home interaction integrity
        run: python3 scripts/verify_home_interactions.py
      - name: Verify Home post reaction integrity
        run: python3 scripts/verify_home_post_reactions.py
      - name: Verify Home multi-media integrity
        run: python3 scripts/verify_home_multimedia_posts.py
      - name: Verify Large Badge #2 — Real Social Creation & Connection
        run: python3 scripts/verify_large_badge2_social_creation_connection.py
      - name: Verify Large Badge #3 — Full Major-Surface Integration Audit
        run: python3 scripts/verify_large_badge3_full_surface_audit.py
      - name: Verify Large Badge #4 — Full Real-Device User-Journey Certification
        run: python3 scripts/verify_large_badge4_real_device_certification.py
      - name: Verify Large Badge #5 — Camera + Media Reliability & Full Media Display Certification
        run: python3 scripts/verify_large_badge5_media_reliability.py
      - name: Verify Large Badge #6 — Marketplace Protected Transaction Full-Lifecycle Certification
        run: python3 scripts/verify_large_badge6_marketplace_protected_transaction.py

      - name: Verify Large Badge #7 — Notifications + Preferences + Delivery Certification
        run: python3 scripts/verify_large_badge7_notifications_preferences.py

      - name: Verify Large Badge #8 — FYNX AI Flows & Intelligence Certification
        run: python3 scripts/verify_large_badge8_ai_intelligence.py
      - name: Verify Large Badge #9 — Trust, Safety & Account Protection Certification
        run: python3 scripts/verify_large_badge9_trust_safety.py
      - name: Verify Home 4F media and lifecycle audit
        run: python3 scripts/verify_home_4f_media_lifecycle.py
      - name: Verify production social feed wiring
        run: python3 scripts/verify_social_feed_production.py
      - name: Verify final FYNX production certification gate
        run: python3 scripts/verify_fynx_production.py
      - name: Verify Large Badge #10 — Final Integration & Release Certification
        run: python3 scripts/verify_large_badge10_final_integration.py
      - name: Verify Large Badge #11 — Final Product Completeness & UX Integration
        run: python3 scripts/verify_large_badge11_product_completeness.py
      - name: Verify Large Badge #13 — Regression, Security & Release Hardening Certification
        run: python3 scripts/verify_large_badge13_regression_security.py
      - name: Verify external service readiness inventory
        run: python3 scripts/verify_external_service_inventory.py
      - name: Generate FYNX investigation report index
        run: python3 scripts/generate_fynx_investigation_report.py
      - name: Fast build, test and lint
        if: ${{ !(((github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py'))) || contains(github.event.head_commit.message, '[apk-only]')) }}
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon --build-cache
      - name: Full build, test and lint
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py')) || contains(github.event.head_commit.message, '[apk-only]') }}
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --build-cache
      - name: Enable KVM for Android emulator tests
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py')) }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -aG kvm "$USER"
          groups
          ls -l /dev/kvm
      - name: Verify authenticated runtime credentials are available
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py')) }}
        env:
          FYNX_E2E_USERNAME: ${{ secrets.FYNX_E2E_USERNAME }}
          FYNX_E2E_PASSWORD: ${{ secrets.FYNX_E2E_PASSWORD }}
        run: |
          test -n "$FYNX_E2E_USERNAME"
          test -n "$FYNX_E2E_PASSWORD"
          echo "Authenticated FYNX visual certification credentials are available."
      - name: Install visual regression tooling
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py')) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          compare -version
          identify -version
      - name: Run Android instrumentation tests and capture the real FYNX UI
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py')) }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FYNX_E2E_USERNAME: ${{ secrets.FYNX_E2E_USERNAME }}
          FYNX_E2E_PASSWORD: ${{ secrets.FYNX_E2E_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            bash -c 'set +e; mkdir -p fynx-runtime-screenshots fynx-maestro-results; TEST_STATUS=0; ./gradlew connectedDebugAndroidTest --no-daemon --build-cache; TEST_STATUS=$?; python3 scripts/verify_runtime_navigation.py; NAV_STATUS=$?; python3 scripts/verify_authenticated_runtime_navigation.py; AUTH_STATUS=$?; printf "Commit: %s\\nRun: %s\\nInstrumentation exit: %s\\nNavigation exit: %s\\nAuthenticated visual exit: %s\\n" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$TEST_STATUS" "$NAV_STATUS" "$AUTH_STATUS" > fynx-runtime-screenshots/README.txt; if [ "$TEST_STATUS" -ne 0 ]; then exit "$TEST_STATUS"; fi; if [ "$NAV_STATUS" -ne 0 ]; then exit "$NAV_STATUS"; fi; if [ "$AUTH_STATUS" -ne 0 ]; then exit "$AUTH_STATUS"; fi; python3 scripts/verify_visual_regression.py; VISUAL_STATUS=$?; if [ "$VISUAL_STATUS" -ne 0 ]; then exit "$VISUAL_STATUS"; fi; python3 scripts/verify_accessibility_screen_safety.py; ACCESSIBILITY_STATUS=$?; if [ "$ACCESSIBILITY_STATUS" -ne 0 ]; then exit "$ACCESSIBILITY_STATUS"; fi; python3 scripts/capture_responsive_profiles.py; RESPONSIVE_CAPTURE_STATUS=$?; if [ "$RESPONSIVE_CAPTURE_STATUS" -ne 0 ]; then exit "$RESPONSIVE_CAPTURE_STATUS"; fi; curl -fsSL "https://get.maestro.mobile.dev" | bash; export PATH="$HOME/.maestro/bin:$PATH"; maestro --version; maestro test .maestro/fynx-launch-and-auth.yaml | tee fynx-maestro-results/maestro.log; MAESTRO_STATUS=$?; printf "Maestro exit: %s\\n" "$MAESTRO_STATUS" > fynx-maestro-results/README.txt; exit "$MAESTRO_STATUS"'
      - name: Upload FYNX runtime screenshots and UI hierarchies
        if: ${{ always() && (github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py')) }}
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-runtime-visual-check-${{ github.sha }}
          path: fynx-runtime-screenshots/
          if-no-files-found: warn
      - name: Upload FYNX accessibility certification evidence
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-accessibility-certification-${{ github.sha }}
          path: fynx-accessibility-certification/
          if-no-files-found: warn
      - name: Upload FYNX visual regression evidence
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-visual-regression-${{ github.sha }}
          path: fynx-visual-regression/
          if-no-files-found: warn
      - name: Large Badge #15 — Responsive and Screen-Safety Certification
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py'))) }}
        run: python3 scripts/verify_large_badge15_responsive.py
      - name: Upload Large Badge #15 evidence
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-large-badge15-responsive-${{ github.sha }}
          path: fynx-responsive-certification/
          if-no-files-found: warn
      - name: Prepare exact-commit APK artifact
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py')) || contains(github.event.head_commit.message, '[apk-only]')) }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p fynx-apk-artifact
          cp app/build/outputs/apk/debug/app-debug.apk "fynx-apk-artifact/FYNX-debug-${GITHUB_SHA}.apk"
          printf 'FYNX Android APK build commit: %s\n' "${GITHUB_SHA}" > "fynx-apk-artifact/FYNX-debug-${GITHUB_SHA}.commit.txt"
          printf 'Workflow run: %s\n' "${GITHUB_RUN_ID}" >> "fynx-apk-artifact/FYNX-debug-${GITHUB_SHA}.commit.txt"
      - name: Large Badge #17 — Full Surface User-Flow Certification
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py'))) }}
        run: python3 scripts/verify_large_badge17_full_surface_journeys.py
      - name: Large Badge #16 — APK Commit Runtime Certification
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py')) || contains(github.event.head_commit.message, '[apk-only]')) }}
        run: python3 scripts/verify_large_badge16_apk_commit_runtime.py
      - name: Upload Large Badge #16 evidence
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py')) || contains(github.event.head_commit.message, '[apk-only]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-large-badge16-apk-runtime-${{ github.sha }}
          path: fynx-apk-certification/
          if-no-files-found: warn
      - name: BrowserStack App Automate real-device verification
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py'))) && env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != '' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p fynx-browserstack-results
          curl --fail --silent --show-error --user "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@app/build/outputs/apk/debug/app-debug.apk" \
            -F "custom_id=FYNX-${GITHUB_SHA}" \
            > fynx-browserstack-results/app-upload.json
          printf 'BrowserStack upload completed for commit %s\n' "$GITHUB_SHA" > fynx-browserstack-results/README.txt
      - name: BrowserStack integration readiness report
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py'))) }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          mkdir -p fynx-browserstack-results
          if [ -n "$BROWSERSTACK_USERNAME" ] && [ -n "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo 'BrowserStack credentials detected; real-device upload step is enabled.' | tee fynx-browserstack-results/readiness.txt
          else
            echo 'BrowserStack integration is installed but credentials are not configured; real-device verification is intentionally skipped.' | tee fynx-browserstack-results/readiness.txt
          fi
      - name: Upload BrowserStack verification evidence
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-browserstack-verification-${{ github.sha }}
          path: fynx-browserstack-results/
          if-no-files-found: warn
      - name: Upload exact-commit debug APK
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py')) || contains(github.event.head_commit.message, '[apk-only]') }}
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-debug-apk-${{ github.sha }}
          path: fynx-apk-artifact/
          if-no-files-found: error
      - name: Upload latest debug APK alias
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py')) || contains(github.event.head_commit.message, '[apk-only]') }}
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-latest-debug-apk
          path: fynx-apk-artifact/
          if-no-files-found: error
      - name: Upload instrumentation test APK
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_runtime == 'true') || (contains(github.event.head_commit.message, '[full-runtime]') || contains(github.event.head_commit.modified, 'scripts/verify_accessibility_screen_safety.py')) || contains(github.event.head_commit.message, '[apk-only]') }}
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-debug-androidTest-apk-${{ github.sha }}
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: ignore
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

# FYNX runtime certification trigger [full-runtime]

name: FYNX Android Build # APK + authenticated runtime certification
# Large Badge 14 certification fixes use full-runtime verification.

on:
  push:
    paths:
      - "app/**"
      - "backend/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/android-build.yml"
      - ".maestro/**"
      - "visual-baselines/**"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "backend/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - "docs/**"
      - ".maestro/**"
      - "visual-baselines/**"
  workflow_dispatch:
    inputs:
      full_runtime:
        description: "Run emulator/UI certification and produce an APK"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: fynx-android-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GOOGLE_CLOUD_PROJECT: fynx-f0868
  FYNX_WIF_PROVIDER: projects/742276831502/locations/global/workloadIdentityPools/fynx-github-actions/providers/fynx-github
  FYNX_GCP_SERVICE_ACCOUNT: fynx-github-actions@fynx-f0868.iam.gserviceaccount.com
  FYNX_PRODUCTION_BASE_URL: https://fynx-ai-backend.onrender.com

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      FYNX_E2E_USERNAME: ${{ secrets.FYNX_E2E_USERNAME }}
      FYNX_E2E_PASSWORD: ${{ secrets.FYNX_E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle with CI caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Authenticate to Google Cloud with Workload Identity Federation
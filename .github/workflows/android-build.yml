name: FYNX Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fynx-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Stage 16 camera and media integration
        run: python3 scripts/verify_stage16_camera.py

      - name: Build, test and lint
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FYNX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FYNX-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
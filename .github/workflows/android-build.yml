name: FYNX Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fynx-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GOOGLE_CLOUD_PROJECT: fynx-f0868
  FYNX_WIF_PROVIDER: projects/742276831502/locations/global/workloadIdentityPools/fynx-github-actions/providers/fynx-github
  FYNX_GCP_SERVICE_ACCOUNT: fynx-github-actions@fynx-f0868.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: fynx-f0868
          workload_identity_provider: ${{ env.FYNX_WIF_PROVIDER }}
          service_account: ${{ env.FYNX_GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify Google Cloud authentication
        run: |
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          gcloud config get-value project

      - name: Verify Stage 16 camera and media integration
        run: python3 scripts/verify_stage16_camera.py

      - name: Build, test and lint
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FYNX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload instrumentation test APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FYNX-debug-androidTest-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: ignore

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FYNX-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

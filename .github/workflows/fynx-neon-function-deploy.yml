name: FYNX Neon Function Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-testing-function:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout canonical FYNX integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/fynx-single-apk-20261013

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: Build and verify FYNX Neon Function
        run: npm run verify:neon

      - name: Require Neon deployment credential
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          required="NEON_API_KEY FYNX_JWT_SECRET FYNX_GEMINI_API_KEY FYNX_PAYSTACK_SECRET_KEY FYNX_OFFICIAL_USERNAME FYNX_WALLET_TEST_MODE_ENABLED FYNX_WALLET_CARD_FUNDING_ENABLED FYNX_WALLET_FUNDING_MIN_AMOUNT FYNX_WALLET_FUNDING_MAX_AMOUNT"
          for name in $required; do
            eval "value=\$name"
            if [ -z "$value" ]; then
              echo "::error::Missing required GitHub secret/variable: $name"
              exit 1
            fi
          done

      - name: Deploy only to the isolated fynx-testing branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          FYNX_JWT_SECRET: ${{ secrets.FYNX_JWT_SECRET }}
          FYNX_GEMINI_API_KEY: ${{ secrets.FYNX_GEMINI_API_KEY }}
          FYNX_PAYSTACK_SECRET_KEY: ${{ secrets.FYNX_PAYSTACK_SECRET_KEY }}
          FYNX_OFFICIAL_USERNAME: ${{ vars.FYNX_OFFICIAL_USERNAME }}
          FYNX_WALLET_TEST_MODE_ENABLED: ${{ vars.FYNX_WALLET_TEST_MODE_ENABLED }}
          FYNX_WALLET_CARD_FUNDING_ENABLED: ${{ vars.FYNX_WALLET_CARD_FUNDING_ENABLED }}
          FYNX_WALLET_FUNDING_MIN_AMOUNT: ${{ vars.FYNX_WALLET_FUNDING_MIN_AMOUNT }}
          FYNX_WALLET_FUNDING_MAX_AMOUNT: ${{ vars.FYNX_WALLET_FUNDING_MAX_AMOUNT }}
        run: |
          umask 077
          cat > .env.neon.deploy <<EOF
          FYNX_JWT_SECRET=$FYNX_JWT_SECRET
          FYNX_GEMINI_API_KEY=$FYNX_GEMINI_API_KEY
          FYNX_PAYSTACK_SECRET_KEY=$FYNX_PAYSTACK_SECRET_KEY
          FYNX_OFFICIAL_USERNAME=$FYNX_OFFICIAL_USERNAME
          FYNX_WALLET_TEST_MODE_ENABLED=$FYNX_WALLET_TEST_MODE_ENABLED
          FYNX_WALLET_CARD_FUNDING_ENABLED=$FYNX_WALLET_CARD_FUNDING_ENABLED
          FYNX_WALLET_FUNDING_MIN_AMOUNT=$FYNX_WALLET_FUNDING_MIN_AMOUNT
          FYNX_WALLET_FUNDING_MAX_AMOUNT=$FYNX_WALLET_FUNDING_MAX_AMOUNT
          EOF
          npx --yes neon@9.2.0 deploy --project-id patient-lab-43403708 --branch br-floral-shape-b5mbajl5 --env .env.neon.deploy

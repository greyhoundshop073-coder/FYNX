name: Add FYNX in-chat message sound

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire incoming message chime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/fynx/app/ui/ConversationPanel.kt')
          s = p.read_text()
          old = '''                if (remote.recipientId == myId) {\n                    realtimeClient.acknowledgeMessage(remote.id)'''
          new = '''                if (remote.recipientId == myId) {\n                    FynxInChatSound.play(context)\n                    realtimeClient.acknowledgeMessage(remote.id)'''
          if 'FynxInChatSound.play(context)' not in s:
              if old not in s:
                  raise SystemExit('incoming-message anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Verify Android build
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon
          ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/fynx/app/ui/ConversationPanel.kt gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git diff --cached --quiet || git commit -m 'Add FYNX in-chat incoming message sound'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/add-in-chat-sound.yml
          git commit -m 'Remove one-time in-chat sound workflow'
          git push

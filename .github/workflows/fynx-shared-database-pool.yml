name: FYNX Shared Database Pool Verification

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/fynx-shared-database-pool.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/fynx-shared-database-pool.yml"

permissions:
  contents: read

concurrency:
  group: fynx-shared-database-pool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Check all backend JavaScript syntax
        run: |
          for file in *.js *.mjs; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Verify shared bounded database pool
        run: node verify-shared-database-pool.mjs
      - name: Verify infrastructure pool contract
        run: node verify-stage15d-batch1.mjs
      - name: Verify backend scaling contract
        run: node verify-stage15e-batch1.mjs

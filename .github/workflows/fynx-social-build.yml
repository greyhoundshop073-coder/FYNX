name: FYNX social core validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-social-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check backend/socialRoutes.js
      - run: test -f app/src/main/java/com/fynx/app/ui/FynxRemoteSocialClient.kt && test -f app/src/main/java/com/fynx/app/ui/FynxRemoteHomeSocialPanel.kt && grep -q 'FynxRemoteHomeSocialPanel' app/src/main/java/com/fynx/app/ui/HomePanel.kt

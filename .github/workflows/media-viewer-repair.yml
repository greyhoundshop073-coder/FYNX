name: Media Viewer Repair

on:
  workflow_dispatch:
  push:
    paths:
      - media-viewer-repair.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply guarded full-screen image viewer repair
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/src/main/java/com/fynx/app/ui/FynxRemoteMedia.kt")
          s = p.read_text(encoding="utf-8")
          if "import androidx.compose.ui.window.Dialog" not in s:
              marker = "import androidx.compose.ui.viewinterop.AndroidView\n"
              if marker not in s:
                  raise SystemExit("Expected AndroidView import not found; refusing to modify source")
              s = s.replace(marker, marker + "import androidx.compose.ui.window.Dialog\n", 1)
          old = '''        "image" -> bitmap?.let {\n            val imageModifier = if (rounded) modifier.clip(RoundedCornerShape(14.dp)) else modifier\n            Image(it.asImageBitmap(), "Media", imageModifier, contentScale = contentScale)\n        }'''
          new = '''        "image" -> bitmap?.let {\n            var showFullScreen by remember(resolvedUrl) { mutableStateOf(false) }\n            val imageModifier = (if (rounded) modifier.clip(RoundedCornerShape(14.dp)) else modifier)\n                .clickable { showFullScreen = true }\n            Image(it.asImageBitmap(), "Open image", imageModifier, contentScale = contentScale)\n            if (showFullScreen) {\n                Dialog(onDismissRequest = { showFullScreen = false }) {\n                    Surface(\n                        modifier = Modifier.fillMaxSize(),\n                        color = Color.Black\n                    ) {\n                        Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {\n                            Image(\n                                bitmap = it.asImageBitmap(),\n                                contentDescription = "Full-screen image",\n                                modifier = Modifier.fillMaxSize(),\n                                contentScale = ContentScale.Fit\n                            )\n                        }\n                    }\n                }\n            }\n        }'''
          if old not in s:
              raise SystemExit("Expected image rendering block was not found; refusing to modify source")
          if "Open image" in s and "Full-screen image" in s:
              print("Full-screen image viewer already present; no change needed")
          else:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("Applied guarded full-screen image viewer repair")

      - name: Verify diff
        run: |
          git diff --check
          git diff -- app/src/main/java/com/fynx/app/ui/FynxRemoteMedia.kt

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source change was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fynx/app/ui/FynxRemoteMedia.kt
          git commit -m "Fix chat image full-screen viewer"
          git push origin main

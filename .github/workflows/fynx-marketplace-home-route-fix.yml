name: FYNX Marketplace Home Route Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply verified Marketplace Home route patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/fynx/app/ui/FynxRemoteHomeSocialPanel.kt")
          text = path.read_text(encoding="utf-8")

          signature = "reactionPickerOpen: Boolean, onOpenMarketplace: () -> Unit) {\n"
          if signature not in text:
              raise SystemExit("RED: RemotePostCard signature anchor not found")

          injected = signature + "    val context = LocalContext.current\n    val marketplaceListingId = Regex(r\"(?m)^Listing ID:\\s*(\\d+)\\s*$\").find(post.text)?.groupValues?.getOrNull(1)\n"
          if "val marketplaceListingId = Regex" not in text:
              text = text.replace(signature, injected, 1)

          old = 'OutlinedButton(onClick = onOpenMarketplace) { Icon(Icons.Default.ShoppingBag, null); Spacer(Modifier.width(5.dp)); Text("View in Marketplace") }'
          new = 'OutlinedButton(onClick = { if (marketplaceListingId.isNullOrBlank()) onOpenMarketplace() else context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(FynxDeepLinkParser.marketplaceAppLink(marketplaceListingId)))) }) { Icon(Icons.Default.ShoppingBag, null); Spacer(Modifier.width(5.dp)); Text("View in Marketplace") }'
          if old not in text:
              raise SystemExit("RED: Marketplace button anchor not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify patch shape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/fynx/app/ui/FynxRemoteHomeSocialPanel.kt")
          s = p.read_text(encoding="utf-8")
          required = [
              'val marketplaceListingId = Regex',
              'FynxDeepLinkParser.marketplaceAppLink(marketplaceListingId)',
              'Text("View in Marketplace")',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f"RED: missing patched anchors: {missing}")
          print("GREEN: Marketplace Home route patch anchors verified")
          PY

      - name: Commit and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fynx/app/ui/FynxRemoteHomeSocialPanel.kt .github/workflows/fynx-marketplace-home-route-fix.yml
          git commit -m "FYNX-THIS-CHAT — preserve exact Marketplace listing from Home posts"
          git rm .github/workflows/fynx-marketplace-home-route-fix.yml
          git commit -m "FYNX-THIS-CHAT — remove completed one-shot Marketplace route fixer"
          git push origin HEAD:main

name: Communication Integrity Repair

on:
  push:
    paths:
      - "communication-repair.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified communication fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/fynx/app/ui/ConversationPanel.kt")
          s = p.read_text()
          pattern = r'(\.pointerInput\(voiceMode, recordingMode, sending\) \{\n)(\s*)if \(!voiceMode \|\| sending\) return@pointerInput'
          replacement = r'''\1\2if (sending) return@pointerInput
          \2if (!voiceMode) {
          \2    detectTapGestures(onTap = { submitComposer() })
          \2    return@pointerInput
          \2}'''
          updated, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit("Expected Send-button gesture block was not found; refusing to modify source")
          p.write_text(updated)
          trigger = Path("communication-repair.trigger")
          if trigger.exists(): trigger.unlink()
          PY

      - name: Commit verified source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fynx/app/ui/ConversationPanel.kt communication-repair.trigger
          git diff --cached --check
          git diff --cached -- app/src/main/java/com/fynx/app/ui/ConversationPanel.kt
          git commit -m "Fix private chat Send button interaction"
          git push origin HEAD:main

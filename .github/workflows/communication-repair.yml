name: Communication Integrity Repair

on:
  push:
    branches:
      - integration/fynx-single-apk-20261013
    paths:
      - "communication-repair.trigger"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: integration/fynx-single-apk-20261013
          fetch-depth: 0

      - name: Apply verified communication fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/fynx/app/ui/ConversationPanel.kt")
          s = p.read_text()
          pattern = r'(\.pointerInput\(voiceMode, recordingMode, sending\) \{\n)(\s*)if \(!voiceMode \|\| sending\) return@pointerInput'
          replacement = r'''\1\2if (sending) return@pointerInput
          \2if (!voiceMode) {
          \2    detectTapGestures(onTap = { submitComposer() })
          \2    return@pointerInput
          \2}'''
          updated, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit("Expected Send-button gesture block was not found; refusing to modify source")
          p.write_text(updated)
          trigger = Path("communication-repair.trigger")
          if trigger.exists(): trigger.unlink()
          PY

      - name: Open reviewable integration pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app/src/main/java/com/fynx/app/ui/ConversationPanel.kt communication-repair.trigger
          if git diff --cached --quiet; then
            echo "No communication source change was produced; nothing to submit."
            exit 0
          fi
          git diff --cached --check
          BRANCH_NAME="automation/communication-repair-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH_NAME"
          git commit -m "Fix private chat Send button interaction"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
          gh pr create --repo "$GITHUB_REPOSITORY" --base integration/fynx-single-apk-20261013 --head "$BRANCH_NAME" \
            --title "fix(chat): repair communication Send interaction" \
            --body "Automated guarded repair. Review the exact source diff and Android CI before merging."

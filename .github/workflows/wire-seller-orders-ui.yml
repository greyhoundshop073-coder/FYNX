name: Wire seller orders UI

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/fynx/app/ui/FynxMarketplaceSellerOrders.kt'
      - 'app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt'
      - '.github/workflows/wire-seller-orders-ui.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add seller orders control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt')
          s = p.read_text()
          marker = '            IconButton(onClick = { showOrders = true }) { Icon(Icons.Default.ReceiptLong, "Orders") }\n'
          insertion = marker + '            FynxMarketplaceSellerOrders(context, onChanged = { reload() })\n'
          if 'FynxMarketplaceSellerOrders(context' not in s:
              if marker not in s:
                  raise SystemExit('orders control marker not found')
              s = s.replace(marker, insertion, 1)
              p.write_text(s)
          PY
          git diff --check
      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add seller order management to marketplace'
          git push
      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/wire-seller-orders-ui.yml
          git commit -m 'Remove one-time seller orders wiring workflow'
          git push

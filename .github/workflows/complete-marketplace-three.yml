name: Complete marketplace three

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch seller management and marketplace discovery
        shell: python
        run: |
          from pathlib import Path
          client = Path('app/src/main/java/com/fynx/app/ui/FynxRemoteSocialClient.kt')
          text = client.read_text()
          marker = '    suspend fun createMarketplaceOrder(\n'
          addition = '''    suspend fun updateMarketplaceListing(context: Context, id: String, title: String, price: Double, quantity: Int): Result<Unit> {\n        val numericId = id.toLongOrNull() ?: return Result.failure(IllegalArgumentException("invalid listing id"))\n        require(title.trim().length >= 2) { "Product name is required." }\n        require(price.isFinite() && price > 0) { "Enter a valid price." }\n        require(quantity > 0) { "Quantity must be at least 1." }\n        return FynxBackendClient.putJson(\n            context,\n            "/api/marketplace/listings/$numericId",\n            JSONObject().apply { put("title", title.trim()); put("price", price); put("quantity", quantity) }.toString()\n        ).map { Unit }\n    }\n\n'''
          if 'suspend fun updateMarketplaceListing' not in text:
              if marker not in text: raise SystemExit('client marker not found')
              text = text.replace(marker, addition + marker, 1)
              client.write_text(text)

          backend = Path('backend/marketplaceCompletion.js')
          text = backend.read_text()
          marker = '\n}'
          addition = r'''\n\n  app.put('/api/marketplace/listings/:id', auth, async (req, res) => {\n    const listingId = Number(req.params.id);\n    const title = typeof req.body?.title === 'string' ? req.body.title.trim().slice(0, 160) : '';\n    const price = Number(req.body?.price);\n    const quantity = Number(req.body?.quantity);\n    if (!Number.isInteger(listingId) || listingId < 1 || title.length < 2 || !Number.isFinite(price) || price <= 0 || !Number.isInteger(quantity) || quantity < 1) {\n      return res.status(400).json({ error: 'valid title, price and quantity are required' });\n    }\n    try {\n      const result = await pool.query(`UPDATE marketplace_listings SET title=$1, price=$2, quantity=$3, active=TRUE, updated_at=NOW() WHERE id=$4 AND seller_id=$5 AND reserved_quantity <= $3 RETURNING id,title,price,quantity,active`, [title, price, quantity, listingId, req.user.sub]);\n      if (!result.rows[0]) return res.status(409).json({ error: 'listing not found, not owned by you, or quantity is below reserved stock' });\n      return res.json({ listing: result.rows[0] });\n    } catch (error) { console.error('marketplace listing update', error); return res.status(500).json({ error: 'listing update failed' }); }\n  });\n\n  app.delete('/api/marketplace/listings/:id', auth, async (req, res) => {\n    const listingId = Number(req.params.id);\n    if (!Number.isInteger(listingId) || listingId < 1) return res.status(400).json({ error: 'invalid listing id' });\n    try {\n      const result = await pool.query(`UPDATE marketplace_listings SET active=FALSE, updated_at=NOW() WHERE id=$1 AND seller_id=$2 AND reserved_quantity=0 RETURNING id,active`, [listingId, req.user.sub]);\n      if (!result.rows[0]) return res.status(409).json({ error: 'listing not found, not owned by you, or has reserved orders' });\n      return res.json({ listing: result.rows[0] });\n    } catch (error) { console.error('marketplace listing delete', error); return res.status(500).json({ error: 'listing removal failed' }); }\n  });'''
          if "app.put('/api/marketplace/listings/:id'" not in text:
              idx = text.rfind(marker)
              if idx < 0: raise SystemExit('backend end marker not found')
              text = text[:idx] + addition + text[idx:]
              backend.write_text(text)

          panel = Path('app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt')
          text = panel.read_text()
          marker = '            FynxMarketplaceSellerOrders(context, onChanged = { reload() })\n'
          if 'FynxMarketplaceSellerManager(context' not in text:
              if marker not in text: raise SystemExit('panel seller marker not found')
              text = text.replace(marker, marker + '            FynxMarketplaceSellerManager(context, onChanged = { reload() })\n', 1)
              panel.write_text(text)
      - name: Verify backend syntax
        run: node --check backend/server.js && node --check backend/marketplaceCompletion.js
      - name: Verify Android build before commit
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon
          ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon
      - name: Commit only after verification passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/fynx/app/ui/FynxRemoteSocialClient.kt app/src/main/java/com/fynx/app/ui/FynxMarketplaceSellerManager.kt app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt backend/marketplaceCompletion.js
          git commit -m 'Complete marketplace status seller management and discovery'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/complete-marketplace-three.yml
          git commit -m 'Remove one-time marketplace completion workflow'
          git push

name: Contact Share Repair

on:
  push:
    paths:
      - '.github/workflows/contact-share-repair.yml'
      - 'scripts/repair_contact_share.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded contact picker repair
        run: python3 scripts/repair_contact_share.py
      - name: Verify diff
        run: |
          git diff --check
          grep -q 'ActivityResultContracts.PickContact()' app/src/main/java/com/fynx/app/ui/ConversationPanel.kt
          grep -q 'ContactsContract.CommonDataKinds.Phone.CONTENT_URI' app/src/main/java/com/fynx/app/ui/ConversationPanel.kt
          grep -q 'sendStructuredMessage(context, chat.username, "contact"' app/src/main/java/com/fynx/app/ui/ConversationPanel.kt
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/fynx/app/ui/ConversationPanel.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Make in-chat contact sharing use device contacts'
          git push origin HEAD:main

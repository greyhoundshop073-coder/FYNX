name: FYNX Notification PR Fast Gate

on:
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "scripts/verify_fcm_notifications.py"
      - "scripts/verify_notifications_settings_integration.py"
      - "scripts/verify_large_badge7_notifications_preferences.py"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/notification-pr-fast.yml"
  push:
    branches:
      - "fynx-notifications-completion-v2"
    paths:
      - "app/**"
      - "scripts/verify_fcm_notifications.py"
      - "scripts/verify_notifications_settings_integration.py"
      - "scripts/verify_large_badge7_notifications_preferences.py"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/notification-pr-fast.yml"

permissions:
  contents: read

concurrency:
  group: fynx-notification-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notification-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Verify FCM notification foundation
        run: python3 scripts/verify_fcm_notifications.py
      - name: Verify notification settings integration
        run: python3 scripts/verify_notifications_settings_integration.py
      - name: Verify notification preferences and delivery certification
        run: python3 scripts/verify_large_badge7_notifications_preferences.py
      - name: Build and test Android notification changes
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --build-cache

name: FYNX Notifications Fast Gate

on:
  push:
    branches:
      - fynx-notifications-completion-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  notifications-fast-gate:
    name: Notifications Fast Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Run notification integration verification
        run: python3 scripts/verify_notifications_settings_integration.py

      - name: Run notification preference delivery verification
        run: python3 scripts/verify_notification_preferences_delivery_contract.py

      - name: Run FCM integration verification
        run: python3 scripts/verify_fcm_integration.py

      - name: Android unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Android debug build
        run: ./gradlew assembleDebug --no-daemon

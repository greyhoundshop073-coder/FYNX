name: FYNX Notifications Fast Gate

on:
  push:
    branches:
      - fynx-notifications-completion-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fynx-notifications-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notifications-fast-gate:
    name: Notifications Fast Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run notification integration verification
        run: python3 scripts/verify_notifications_settings_integration.py

      - name: Run notification preference delivery verification
        run: python3 scripts/verify_large_badge7_notifications_preferences.py

      - name: Run FCM notification verification
        run: python3 scripts/verify_fcm_notifications.py

      - name: Android unit tests, lint, and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --build-cache

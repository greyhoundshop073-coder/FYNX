name: FYNX Chat Group Parity + Layout Safety

on:
  push:
    branches: ["main", "integration/fynx-single-apk-20261013"]
  pull_request:
    branches: ["main", "integration/fynx-single-apk-20261013"]

jobs:
  parity-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Chat and Groups certification script syntax
        run: |
          bash -n scripts/run_android_runtime_certification.sh
          python3 -m py_compile scripts/verify_authenticated_runtime_navigation.py scripts/verify_chat_final_closure.py scripts/verify_r5a_groups.py scripts/verify_chat_group_layout_and_parity_gate.py
      - name: Verify active Chat/Groups closure and group security contracts
        run: |
          python3 scripts/verify_chat_final_closure.py
          python3 scripts/verify_r5a_groups.py
      - name: Verify Chat and Group parity/layout contracts
        run: python3 scripts/verify_chat_group_layout_and_parity_gate.py
      - name: Verify private Chat offline send and structured recovery
        run: python3 scripts/verify_offline_chat_send.py
      - name: Android regression build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --build-cache --stacktrace

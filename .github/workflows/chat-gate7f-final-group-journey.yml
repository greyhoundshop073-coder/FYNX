name: FYNX Chat Gate 7F — final group/private journey certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/fynx/app/ui/**'
      - 'scripts/verify_chat_gate7f_final_group_journey.py'
      - '.github/workflows/chat-gate7f-final-group-journey.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Chat Gate 7F journey contracts
        run: python3 scripts/verify_chat_gate7f_final_group_journey.py

      - name: Android unit tests, lint and debug APK build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --build-cache

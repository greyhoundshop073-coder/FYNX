name: FYNX Remote Config safe rollout

on:
  pull_request:
    branches: ["integration/fynx-single-apk-20261013"]
    paths:
      - "app/src/androidTest/java/com/fynx/app/FynxRemoteConfigLiveFetchTest.kt"
      - "firebase/remoteconfig.template.json"
      - "scripts/publish_fynx_remote_config.mjs"
      - "scripts/publish_fynx_remote_config.test.mjs"
      - ".github/workflows/fynx-remote-config-rollout.yml"
  push:
    branches: ["integration/fynx-single-apk-20261013"]
    paths:
      - "app/src/androidTest/java/com/fynx/app/FynxRemoteConfigLiveFetchTest.kt"
      - "firebase/remoteconfig.template.json"
      - "scripts/publish_fynx_remote_config.mjs"
      - "scripts/publish_fynx_remote_config.test.mjs"
      - ".github/workflows/fynx-remote-config-rollout.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: fynx-remote-config-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  GOOGLE_CLOUD_PROJECT: fynx-f0868
  FYNX_WIF_PROVIDER: projects/742276831502/locations/global/workloadIdentityPools/fynx-github-actions/providers/fynx-github
  FYNX_GCP_SERVICE_ACCOUNT: fynx-github-actions@fynx-f0868.iam.gserviceaccount.com

jobs:
  validate-and-rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate publisher syntax and safe merge policy
        run: |
          node --check scripts/publish_fynx_remote_config.mjs
          node --test scripts/publish_fynx_remote_config.test.mjs
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Compile live Remote Config instrumentation without requiring an emulator
        run: ./gradlew compileDebugAndroidTestKotlin --no-daemon --build-cache
      - name: Authenticate to FYNX Firebase project
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/fynx-single-apk-20261013' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: fynx-f0868
          workload_identity_provider: ${{ env.FYNX_WIF_PROVIDER }}
          service_account: ${{ env.FYNX_GCP_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/fynx-single-apk-20261013' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Safely publish missing all-false FYNX parameters
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/fynx-single-apk-20261013' }}
        run: node scripts/publish_fynx_remote_config.mjs
      - name: Enable Android emulator KVM access
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/fynx-single-apk-20261013' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Verify published Firebase values from Android 15
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/fynx-single-apk-20261013' }}
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          emulator-boot-timeout: 900
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          profile: pixel_2
          disk-size: 2G
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          pre-emulator-launch-script: bash scripts/configure_android_emulator_storage.sh
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.fynx.app.FynxRemoteConfigLiveFetchTest --no-daemon --build-cache

name: FYNX Marketplace Voiceover

on:
  push:
    branches:
      - main
      - feature/fynx-natural-marketplace-voiceover-laura
    paths:
      - ".github/workflows/fish-audio-marketplace-voiceover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-voiceover:
    name: Generate marketplace narration
    runs-on: ubuntu-latest
    steps:
      - name: Verify API secret is available
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          if [ -z "$FISH_API_KEY" ]; then
            echo "::error::FISH_API_KEY Actions secret is missing."
            exit 1
          fi

      - name: Generate natural female narration with Fish Audio Laura
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 2 --retry-all-errors --max-time 180 \
            --request POST "https://api.fish.audio/v1/tts" \
            --header "Authorization: Bearer ${FISH_API_KEY}" \
            --header "Content-Type: application/json" \
            --header "model: s2.1-pro-free" \
            --data-binary @- \
            --output FYNX-Marketplace-Voiceover.mp3 <<'JSON'
          {
            "text": "Welcome to F. Y. N. X. — your marketplace, your business, your next opportunity. Discover products you will love. Find trusted sellers. Show the world what you have to offer. And connect with customers who are ready to buy. Whether you are shopping or building a business, F. Y. N. X. brings opportunity closer. F. Y. N. X. — discover more. Connect more. Grow more.",
            "reference_id": "e3cd384158934cc9a01029cd7d278634",
            "format": "mp3"
          }
          JSON
          test -s FYNX-Marketplace-Voiceover.mp3
          if ! file FYNX-Marketplace-Voiceover.mp3 | grep -qi 'audio\|mpeg\|mp3'; then
            echo "::error::Fish Audio response is not recognized as an MP3 file."
            exit 1
          fi
          ls -lh FYNX-Marketplace-Voiceover.mp3

      - name: Upload downloadable MP3
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-Marketplace-Voiceover
          path: FYNX-Marketplace-Voiceover.mp3
          if-no-files-found: error
          retention-days: 14

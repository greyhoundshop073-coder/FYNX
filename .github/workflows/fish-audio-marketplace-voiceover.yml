name: FYNX Marketplace Voiceover

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fish-audio-marketplace-voiceover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-voiceover:
    name: Generate marketplace narration
    runs-on: ubuntu-latest
    steps:
      - name: Verify API secret is available
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          if [ -z "$FISH_API_KEY" ]; then
            echo "::error::FISH_API_KEY Actions secret is missing."
            exit 1
          fi

      - name: Generate measured male narration with Fish Audio Adrian
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 2 --retry-all-errors --max-time 180 \
            --request POST "https://api.fish.audio/v1/tts" \
            --header "Authorization: Bearer ${FISH_API_KEY}" \
            --header "Content-Type: application/json" \
            --header "model: s2.1-pro-free" \
            --data-binary @- \
            --output FYNX-Marketplace-Voiceover.mp3 <<'JSON'
          {
            "text": "Welcome to F. Y. N. X. Your marketplace. Your business. Your next opportunity. Discover products you will love. Meet sellers ready to serve you. And put your own products in front of customers who are ready to buy. From your first discovery to your next sale, F. Y. N. X. helps bring people and opportunity together. F. Y. N. X. Discover more. Connect more. Grow your business.",
            "reference_id": "bf322df2096a46f18c579d0baa36f41d",
            "format": "mp3"
          }
          JSON
          test -s FYNX-Marketplace-Voiceover.mp3
          if ! file FYNX-Marketplace-Voiceover.mp3 | grep -qi 'audio\|mpeg\|mp3'; then
            echo "::error::Fish Audio response is not recognized as an MP3 file."
            exit 1
          fi
          ls -lh FYNX-Marketplace-Voiceover.mp3

      - name: Upload downloadable MP3
        uses: actions/upload-artifact@v4
        with:
          name: FYNX-Marketplace-Voiceover
          path: FYNX-Marketplace-Voiceover.mp3
          if-no-files-found: error
          retention-days: 14

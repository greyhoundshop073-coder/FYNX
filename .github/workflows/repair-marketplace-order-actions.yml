name: Repair FYNX Marketplace Order Actions

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rewrite only the marketplace OrderActions block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt')
          s = p.read_text()
          marker = '@Composable\nprivate fun OrderActions('
          start = s.find(marker)
          if start < 0:
              raise SystemExit('OrderActions marker not found')
          replacement = '''@Composable
private fun OrderActions(
    context: android.content.Context,
    order: FynxRemoteSocialClient.MarketplaceOrder,
    onChanged: () -> Unit,
    onClose: () -> Unit
) {
    var dispute by remember { mutableStateOf(false) }
    var details by remember { mutableStateOf("") }
    var rating by remember { mutableIntStateOf(5) }
    var comment by remember { mutableStateOf("") }
    val scope = rememberCoroutineScope()

    AlertDialog(
        onDismissRequest = onClose,
        title = { Text("Order ${order.status}") },
        text = {
            Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                Text(order.productTitle)
                Text("Total: ${order.currency} ${String.format(Locale.US, "%,.2f", order.totalAmount)}")
                Text(
                    "Protected order. Complete payment through an approved payment provider before shipment.",
                    style = MaterialTheme.typography.bodySmall
                )

                if (dispute) {
                    OutlinedTextField(
                        value = details,
                        onValueChange = { details = it },
                        label = { Text("What happened?") },
                        minLines = 3
                    )
                } else if (order.status == "PAYMENT_PENDING") {
                    Text("You can cancel this unpaid order.")
                } else if (order.status == "COMPLETED") {
                    Text("Rate seller")
                    Row {
                        (1..5).forEach { star ->
                            TextButton(onClick = { rating = star }) {
                                Text(if (star <= rating) "★" else "☆")
                            }
                        }
                    }
                    OutlinedTextField(
                        value = comment,
                        onValueChange = { comment = it },
                        label = { Text("Review") },
                        minLines = 2
                    )
                }
            }
        },
        confirmButton = {
            when {
                dispute -> {
                    Button(onClick = {
                        scope.launch {
                            FynxRemoteSocialClient.disputeMarketplaceOrder(
                                context,
                                order.id,
                                "OTHER",
                                details
                            ).onSuccess { onChanged() }
                        }
                    }) {
                        Text("Open dispute")
                    }
                }
                order.status == "PAYMENT_PENDING" -> {
                    Button(onClick = {
                        scope.launch {
                            FynxRemoteSocialClient.cancelMarketplaceOrder(
                                context,
                                order.id
                            ).onSuccess { onChanged() }
                        }
                    }) {
                        Text("Cancel order")
                    }
                }
                order.status == "COMPLETED" -> {
                    Button(onClick = {
                        scope.launch {
                            FynxRemoteSocialClient.reviewMarketplaceOrder(
                                context,
                                order.id,
                                rating,
                                comment
                            ).onSuccess { onChanged() }
                        }
                    }) {
                        Text("Submit review")
                    }
                }
                else -> {
                    Spacer(Modifier.size(1.dp))
                }
            }
        },
        dismissButton = {
            TextButton(
                onClick = {
                    if (!dispute && order.status != "COMPLETED") {
                        dispute = true
                    } else {
                        onClose()
                    }
                }
            ) {
                Text(if (!dispute && order.status != "COMPLETED") "Report problem" else "Close")
            }
        }
    )
}
'''
          new = s[:start] + replacement
          if new == s:
              raise SystemExit('No change required')
          p.write_text(new)
          print('Rewrote only OrderActions with explicit Compose/Kotlin braces.')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt
          git commit -m 'Harden marketplace order actions Kotlin syntax'
          git push

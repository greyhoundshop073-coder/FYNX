name: Marketplace speed patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marketplace-speed-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize marketplace UI
        shell: bash
        run: |
          set -euo pipefail
          FILE='app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt')
          s = p.read_text()
          if 'var searchInput by remember' not in s:
              s = s.replace('import kotlinx.coroutines.launch\n', 'import kotlinx.coroutines.delay\nimport kotlinx.coroutines.launch\n', 1)
              s = s.replace('    var query by remember { mutableStateOf("") }\n', '    var query by remember { mutableStateOf("") }\n    var searchInput by remember { mutableStateOf("") }\n', 1)
              start = s.index('    fun reload() {')
              end = s.index('\n    LaunchedEffect(query, category)', start)
              block = '''    fun reloadListings() {
        scope.launch {
            loading = true
            error = null
            FynxRemoteSocialClient.listings(context, query, category)
                .onSuccess { listings = it }
                .onFailure { error = it.message ?: "Marketplace could not load." }
            loading = false
        }
    }

    fun loadOrders() {
        scope.launch {
            FynxRemoteSocialClient.orders(context).onSuccess { orders = it }
        }
    }

    LaunchedEffect(searchInput) {
        delay(350)
        query = searchInput.trim()
    }
'''
              s = s[:start] + block + s[end:]
              s = s.replace('LaunchedEffect(query, category) { reload() }', 'LaunchedEffect(query, category) { reloadListings() }', 1)
              s = s.replace('IconButton(onClick = { showOrders = true })', 'IconButton(onClick = { showOrders = true; loadOrders() })', 1)
              s = s.replace('FynxMarketplaceSellerOrders(context, onChanged = { reload() })', 'FynxMarketplaceSellerOrders(context, onChanged = { reloadListings() })', 1)
              s = s.replace('IconButton(onClick = { reload() })', 'IconButton(onClick = { reloadListings(); loadOrders() })', 1)
              s = s.replace('OutlinedTextField(query, { query = it }, Modifier.weight(2f)', 'OutlinedTextField(searchInput, { searchInput = it }, Modifier.weight(2f)', 1)
              s = s.replace('onPublished = { showSell = false; reload() }', 'onPublished = { showSell = false; reloadListings() }', 1)
              s = s.replace('paymentOrder = null\n                reload()', 'paymentOrder = null\n                reloadListings()\n                loadOrders()', 1)
              s = s.replace('if (showOrders) MarketplaceOrders(context, orders, onRefresh = { reload() },', 'if (showOrders) MarketplaceOrders(context, orders, onRefresh = { loadOrders() },', 1)
          old = 'if (local != null) bitmap = withContext(Dispatchers.IO) { runCatching { context.contentResolver.openInputStream(local).use { BitmapFactory.decodeStream(it) } }.getOrNull() }'
          new = '''if (local != null) bitmap = withContext(Dispatchers.IO) {
            runCatching {
                val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                context.contentResolver.openInputStream(local).use { BitmapFactory.decodeStream(it, null, bounds) }
                val sample = if (bounds.outWidth > 1200 || bounds.outHeight > 1200) 2 else 1
                val options = BitmapFactory.Options().apply {
                    inSampleSize = sample
                    inPreferredConfig = Bitmap.Config.RGB_565
                }
                context.contentResolver.openInputStream(local).use { BitmapFactory.decodeStream(it, null, options) }
            }.getOrNull()
        }'''
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/fynx/app/ui/FynxMarketplacePanel.kt
          git commit -m 'Make marketplace loading and media rendering faster' || true
          git rm .github/workflows/marketplace-speed-patch.yml
          git commit -m 'Remove marketplace speed patch workflow'
          git push